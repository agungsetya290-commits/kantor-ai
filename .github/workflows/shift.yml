name: Shift malam Kantor AI

on:
  schedule:
    - cron: "0 9 * * *"     # 16:00 WIB: agent kerja (sesudah kuota Gemini reset)
    - cron: "30 2 * * *"    # 09:30 WIB: kirim yang sudah disetujui CEO
  workflow_dispatch:         # tombol "Run workflow" buat tes manual

permissions:
  contents: write

concurrency:
  group: shift
  cancel-in-progress: false

jobs:
  shift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Agent kerja
        if: github.event.schedule != '30 2 * * *'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
        run: python agents/office.py

      - name: Kirim yang disetujui ke Threads
        if: always()
        env:
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
        run: python agents/post.py || true

      - name: Simpan hasil ke repo
        if: always()
        run: |
          git config user.name "kantor-ai"
          git config user.email "kantor-ai@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "shift $(TZ=Asia/Jakarta date +%Y-%m-%d)"
          git push
