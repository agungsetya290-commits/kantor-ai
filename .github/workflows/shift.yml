name: Shift malam Kantor AI

on:
  schedule:
    - cron: "30 17 * * *"   # 00:30 WIB tiap hari
  workflow_dispatch:         # tombol "Run workflow" buat tes manual

permissions:
  contents: write

concurrency:
  group: shift
  cancel-in-progress: false

jobs:
  shift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Agent kerja
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: python agents/office.py

      - name: Simpan hasil ke repo
        if: always()
        run: |
          git config user.name "kantor-ai"
          git config user.email "kantor-ai@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "shift $(TZ=Asia/Jakarta date +%Y-%m-%d)"
          git push
