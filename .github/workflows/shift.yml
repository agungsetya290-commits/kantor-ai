name: Shift malam Kantor AI

on:
  workflow_dispatch:       # dipakai tombol manual dan pemicu luar (cron-job.org)
    inputs:
      agent:
        description: "Jalankan agent Gemini juga"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: shift
  cancel-in-progress: false

jobs:
  shift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Agent kerja
        if: github.event_name == 'schedule' || format('{0}', inputs.agent) == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
        run: |
          if [ "$(python agents/perlu_agent.py)" != "ya" ]; then
            echo "agent sudah menghasilkan caption untuk periode ini, dilewati"
          else
            python agents/office.py || true
          fi

      - name: Isi antrean cadangan kalau agent gagal
        if: always()
        run: python agents/cadangan.py

      - name: Kirim yang disetujui ke Threads
        if: always()
        env:
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
        run: python agents/post.py || true

      - name: Simpan hasil ke repo
        if: always()
        run: |
          git config user.name "kantor-ai"
          git config user.email "kantor-ai@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "shift $(TZ=Asia/Jakarta date +%Y-%m-%d-%H%M)"
          git pull --rebase || true
          git push
